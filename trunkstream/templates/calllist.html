<!DOCTYPE html>
<html data-bs-theme="dark">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script type="text/javascript">
        function localize(t)
        {
          var d=new Date(t+" UTC");
          document.write(d.toLocaleString());
        }
        function toutc(t)
        {
          var d=new Date(t+" UTC");
          document.write(d.toString());
        }
        </script>
<head>

</head>
 
<body>
    <div class="table-responsive container-fluid">
            <table class="table table-striped-columns table-bordered">
                {% for call in calls %}
                    <tr {% if call.tones.has_tones %} class="table-danger" {%endif%} >
                        <td class="text-nowrap">{{call.start_time_local.strftime("%m-%d-%Y %H:%M:%S")}}</script></td>
                        <td>{{call.talkgroup_tag}}</td>
                        <td>{{call.call_length | int()}}</td>
                        {% autoescape false %}
                        <td><p class="text-wrap">
                            {{call.transcript.transcript | replace('\n','<br>')}}
                            </p>    
                        </td>
                        {% endautoescape %}
                    </tr>
                {% endfor %}
            </table>
    </div>
</body>
 
</html>
